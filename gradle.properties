org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC --add-opens=java.base/java.lang=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Rails API base URL used by debug builds (must end with /api/v1/).
#   Emulator          -> http://10.0.2.2:3000/api/v1/   (10.0.2.2 = your computer's localhost)
#   Phone on same Wi-Fi -> http://<your-computer-LAN-IP>:3000/api/v1/  and run: bin/rails s -b 0.0.0.0
AGHOUR_API_URL_DEBUG=http://192.168.1.26:4000/api/v1/
# Production API (HTTPS only). Change when the backend is deployed.
AGHOUR_API_URL_RELEASE=https://village-platform.vercel.app/api/v1/

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
